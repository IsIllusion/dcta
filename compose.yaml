name: dcta-public-${DEPLOYMENT_SLOT:?Set DEPLOYMENT_SLOT in .env}
services:
  app:
    build: .
    env_file: .env
    environment:
      BIND_ADDRESS: 0.0.0.0
      PORT: "8780"
      DCTA_DATA_DIR: /data
    volumes:
      - visitor-data:/data
    expose:
      - "8780"
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    mem_limit: 2g
    cpus: 2
    pids_limit: 128
  web:
    image: caddy:2
    environment:
      DEMO_DOMAIN: ${DEMO_DOMAIN:?Set DEMO_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
volumes:
  visitor-data:
  caddy-data:
  caddy-config:

